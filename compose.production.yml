  scheduler:
    image: q-academy-dispatcher:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: dispatcher
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
    restart: "on-failure:5"
    init: true
    user: "1001:1001"
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in the production env file}
      JOB_DISPATCH_INTERVAL_SECONDS: ${JOB_DISPATCH_INTERVAL_SECONDS:-15}
      MAINTENANCE_CLEANUP_INTERVAL_SECONDS: ${MAINTENANCE_CLEANUP_INTERVAL_SECONDS:-3600}
      WORKER_MAX_CONSECUTIVE_FAILURES: ${SCHEDULER_MAX_CONSECUTIVE_FAILURES:-5}
      WORKER_HEARTBEAT_STALE_SECONDS: ${SCHEDULER_HEARTBEAT_STALE_SECONDS:-180}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${JOB_DISPATCH_INTERVAL_SECONDS}:$${MAINTENANCE_CLEANUP_INTERVAL_SECONDS}" in
          *[!0-9:]*) printf 'Scheduler intervals must be whole seconds.\n' >&2; exit 1 ;;
        esac
        if [ "$${JOB_DISPATCH_INTERVAL_SECONDS}" -lt 5 ] || [ "$${MAINTENANCE_CLEANUP_INTERVAL_SECONDS}" -lt 300 ]; then
          printf 'Scheduler intervals are below their safe minimum.\n' >&2; exit 1
        fi
        case "$${WORKER_MAX_CONSECUTIVE_FAILURES}:$${WORKER_HEARTBEAT_STALE_SECONDS}" in
          *[!0-9:]*) printf 'Scheduler health limits must be whole seconds/counts.\n' >&2; exit 1 ;;
        esac
        if [ "$${#WORKER_MAX_CONSECUTIVE_FAILURES}" -gt 2 ] || [ "$${WORKER_MAX_CONSECUTIVE_FAILURES}" -lt 1 ] || [ "$${WORKER_MAX_CONSECUTIVE_FAILURES}" -gt 20 ]; then
          printf 'Scheduler failure limit must be between 1 and 20.\n' >&2; exit 1
        fi
        if [ "$${#WORKER_HEARTBEAT_STALE_SECONDS}" -gt 5 ] || [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -lt 60 ] || [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -gt 86400 ]; then
          printf 'Scheduler heartbeat age must be between 60 and 86400 seconds.\n' >&2; exit 1
        fi
        minimum_heartbeat_age="$$((JOB_DISPATCH_INTERVAL_SECONDS + 45 + 60))"
        if [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -lt "$${minimum_heartbeat_age}" ]; then
          printf 'Scheduler heartbeat age is shorter than one dispatch cycle.\n' >&2; exit 1
        fi
        case "$${CRON_SECRET}" in
          ""|*[!a-fA-F0-9]*) printf 'CRON_SECRET must be hexadecimal.\n' >&2; exit 1 ;;
        esac
        if [ "$${#CRON_SECRET}" -lt 32 ]; then
          printf 'CRON_SECRET is too short.\n' >&2; exit 1
        fi
        authorization_header="Authorization: Bearer $${CRON_SECRET}"
        unset CRON_SECRET
        last_cleanup=0
        consecutive_failures=0
        success_marker=/tmp/scheduler.last-success
        while true; do
          now="$$(date +%s)"
          endpoint="http://app:3000/api/internal/jobs/dispatch"
          cleanup_due=false
          if [ "$$((now - last_cleanup))" -ge "$${MAINTENANCE_CLEANUP_INTERVAL_SECONDS}" ]; then
            endpoint="$${endpoint}?cleanup=run&cleanupLimit=1000"
            cleanup_due=true
          fi
          if status="$$(
            printf '%s\n' "$${authorization_header}" |
              node /opt/q-academy/dispatcher-http-post.mjs \
                --url "$${endpoint}" \
                --timeout-seconds 45
          )"; then :; else status=000; fi
          case "$${status}" in
            2??)
              consecutive_failures=0
              printf '%s\n' "$${now}" > "$${success_marker}.tmp"
              mv "$${success_marker}.tmp" "$${success_marker}"
              if [ "$${cleanup_due}" = true ]; then last_cleanup="$${now}"; fi
              ;;
            *)
              consecutive_failures="$$((consecutive_failures + 1))"
              printf '%s job dispatch failure %s/%s, HTTP %s\n' "$$(date -u +%FT%TZ)" "$${consecutive_failures}" "$${WORKER_MAX_CONSECUTIVE_FAILURES}" "$${status:-000}" >&2
              if [ "$${consecutive_failures}" -ge "$${WORKER_MAX_CONSECUTIVE_FAILURES}" ]; then exit 1; fi
              ;;
          esac
          sleep "$${JOB_DISPATCH_INTERVAL_SECONDS}"
        done
    depends_on:
      app:
        condition: service_healthy
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/scheduler.last-success && last_success=$$(cat /tmp/scheduler.last-success) && now=$$(date +%s) && test \"$${last_success}\" -le \"$${now}\" && test \"$$((now - last_success))\" -le \"$${WORKER_HEARTBEAT_STALE_SECONDS}\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 90s
    logging: *default-logging

  media-worker:
    image: q-academy-dispatcher:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: dispatcher
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
    restart: "on-failure:5"
    init: true
    user: "1001:1001"
    deploy:
      replicas: 2
    environment:
      CRON_SECRET: ${MEDIA_CRON_SECRET:?Set MEDIA_CRON_SECRET in the production env file}
      MEDIA_WORKER_POLL_SECONDS: ${MEDIA_WORKER_POLL_SECONDS:-10}
      WORKER_MAX_CONSECUTIVE_FAILURES: ${MEDIA_WORKER_MAX_CONSECUTIVE_FAILURES:-3}
      WORKER_HEARTBEAT_STALE_SECONDS: ${MEDIA_WORKER_HEARTBEAT_STALE_SECONDS:-15000}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${MEDIA_WORKER_POLL_SECONDS}" in
          ""|*[!0-9]*) printf 'MEDIA_WORKER_POLL_SECONDS must be whole seconds.\n' >&2; exit 1 ;;
        esac
        if [ "$${MEDIA_WORKER_POLL_SECONDS}" -lt 5 ]; then
          printf 'MEDIA_WORKER_POLL_SECONDS is below its safe minimum.\n' >&2; exit 1
        fi
        case "$${WORKER_MAX_CONSECUTIVE_FAILURES}:$${WORKER_HEARTBEAT_STALE_SECONDS}" in
          *[!0-9:]*) printf 'Media worker health limits must be whole seconds/counts.\n' >&2; exit 1 ;;
        esac
        if [ "$${#WORKER_MAX_CONSECUTIVE_FAILURES}" -gt 2 ] || [ "$${WORKER_MAX_CONSECUTIVE_FAILURES}" -lt 1 ] || [ "$${WORKER_MAX_CONSECUTIVE_FAILURES}" -gt 20 ]; then
          printf 'Media worker failure limit must be between 1 and 20.\n' >&2; exit 1
        fi
        if [ "$${#WORKER_HEARTBEAT_STALE_SECONDS}" -gt 5 ] || [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -lt 14470 ] || [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -gt 86400 ]; then
          printf 'Media worker heartbeat age must be between 14470 and 86400 seconds.\n' >&2; exit 1
        fi
        minimum_heartbeat_age="$$((MEDIA_WORKER_POLL_SECONDS + 14400 + 60))"
        if [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -lt "$${minimum_heartbeat_age}" ]; then
          printf 'Media worker heartbeat age is shorter than one scan cycle.\n' >&2; exit 1
        fi
        case "$${CRON_SECRET}" in
          ""|*[!a-fA-F0-9]*) printf 'CRON_SECRET must be hexadecimal.\n' >&2; exit 1 ;;
        esac
        if [ "$${#CRON_SECRET}" -lt 32 ]; then
          printf 'CRON_SECRET is too short.\n' >&2; exit 1
        fi
        authorization_header="Authorization: Bearer $${CRON_SECRET}"
        unset CRON_SECRET
        consecutive_failures=0
        success_marker=/tmp/media-worker.last-success
        in_progress_marker=/tmp/media-worker.in-progress
        while true; do
          response_file=/tmp/media-dispatch.json
          rm -f "$${response_file}"
          now="$$(date +%s)"
          printf '%s\n' "$${now}" > "$${in_progress_marker}.tmp"
          mv "$${in_progress_marker}.tmp" "$${in_progress_marker}"
          (
            while true; do
              sleep 30
              now="$$(date +%s)"
              printf '%s\n' "$${now}" > "$${in_progress_marker}.tmp"
              mv "$${in_progress_marker}.tmp" "$${in_progress_marker}"
            done
          ) &
          in_progress_pid=$$!
          if status="$$(
            printf '%s\n' "$${authorization_header}" |
              node /opt/q-academy/dispatcher-http-post.mjs \
                --url 'http://media-runner:3000/api/internal/jobs/media/dispatch?limit=1' \
                --timeout-seconds 14400 \
                --output "$${response_file}"
          )"; then :; else status=000; fi
          if kill "$${in_progress_pid}" 2>/dev/null; then :; fi
          if wait "$${in_progress_pid}" 2>/dev/null; then :; fi
          rm -f "$${in_progress_marker}" "$${in_progress_marker}.tmp"
          body=""
          if [ -f "$${response_file}" ]; then body="$$(cat "$${response_file}")"; fi
          rm -f "$${response_file}"
          case "$${status}" in
            2??)
              consecutive_failures=0
              now="$$(date +%s)"
              printf '%s\n' "$${now}" > "$${success_marker}.tmp"
              mv "$${success_marker}.tmp" "$${success_marker}"
              case "$${body}" in
                *'"processed":0'*'"depth":0'*) ;;
                *) printf '%s media dispatch completed\n' "$$(date -u +%FT%TZ)" ;;
              esac
              ;;
            *)
              consecutive_failures="$$((consecutive_failures + 1))"
              printf '%s media dispatch failure %s/%s, HTTP %s\n' "$$(date -u +%FT%TZ)" "$${consecutive_failures}" "$${WORKER_MAX_CONSECUTIVE_FAILURES}" "$${status:-000}" >&2
              if [ "$${consecutive_failures}" -ge "$${WORKER_MAX_CONSECUTIVE_FAILURES}" ]; then exit 1; fi
              ;;
          esac
          sleep "$${MEDIA_WORKER_POLL_SECONDS}"
        done
    depends_on:
      media-runner:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - jobs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          now=$$(date +%s);
          if test -s /tmp/media-worker.last-success; then
            last_success=$$(cat /tmp/media-worker.last-success);
            if test "$${last_success}" -le "$${now}" &&
              test "$$((now - last_success))" -le "$${WORKER_HEARTBEAT_STALE_SECONDS}"; then exit 0; fi;
          fi;
          test -s /tmp/media-worker.in-progress &&
          in_progress=$$(cat /tmp/media-worker.in-progress) &&
          test "$${in_progress}" -le "$${now}" &&
          test "$$((now - in_progress))" -le 120
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 25m
    logging: *default-logging

  media-maintenance:
    image: q-academy-dispatcher:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: dispatcher
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
    restart: "on-failure:5"
    init: true
    user: "1001:1001"
    deploy:
      replicas: 1
    environment:
      CRON_SECRET: ${MEDIA_CRON_SECRET:?Set MEDIA_CRON_SECRET in the production env file}
      MEDIA_MAINTENANCE_INTERVAL_SECONDS: ${MEDIA_MAINTENANCE_INTERVAL_SECONDS:-60}
      WORKER_MAX_CONSECUTIVE_FAILURES: ${MEDIA_MAINTENANCE_MAX_CONSECUTIVE_FAILURES:-3}
      WORKER_HEARTBEAT_STALE_SECONDS: ${MEDIA_MAINTENANCE_HEARTBEAT_STALE_SECONDS:-700}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${MEDIA_MAINTENANCE_INTERVAL_SECONDS}" in
          ""|*[!0-9]*) printf 'MEDIA_MAINTENANCE_INTERVAL_SECONDS must be whole seconds.\n' >&2; exit 1 ;;
        esac
        if [ "$${MEDIA_MAINTENANCE_INTERVAL_SECONDS}" -lt 30 ] || [ "$${MEDIA_MAINTENANCE_INTERVAL_SECONDS}" -gt 3600 ]; then
          printf 'MEDIA_MAINTENANCE_INTERVAL_SECONDS must be between 30 and 3600.\n' >&2; exit 1
        fi
        case "$${WORKER_MAX_CONSECUTIVE_FAILURES}:$${WORKER_HEARTBEAT_STALE_SECONDS}" in
          *[!0-9:]*) printf 'Media maintenance health limits must be whole seconds/counts.\n' >&2; exit 1 ;;
        esac
        if [ "$${#WORKER_MAX_CONSECUTIVE_FAILURES}" -gt 2 ] || [ "$${WORKER_MAX_CONSECUTIVE_FAILURES}" -lt 1 ] || [ "$${WORKER_MAX_CONSECUTIVE_FAILURES}" -gt 20 ]; then
          printf 'Media maintenance failure limit must be between 1 and 20.\n' >&2; exit 1
        fi
        if [ "$${#WORKER_HEARTBEAT_STALE_SECONDS}" -gt 5 ] || [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -lt 600 ] || [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -gt 86400 ]; then
          printf 'Media maintenance heartbeat age must be between 600 and 86400 seconds.\n' >&2; exit 1
        fi
        minimum_heartbeat_age="$$((MEDIA_MAINTENANCE_INTERVAL_SECONDS + 550 + 60))"
        if [ "$${WORKER_HEARTBEAT_STALE_SECONDS}" -lt "$${minimum_heartbeat_age}" ]; then
          printf 'Media maintenance heartbeat age is shorter than one maintenance cycle.\n' >&2; exit 1
        fi
        case "$${CRON_SECRET}" in
          ""|*[!a-fA-F0-9]*) printf 'CRON_SECRET must be hexadecimal.\n' >&2; exit 1 ;;
        esac
        if [ "$${#CRON_SECRET}" -lt 32 ]; then
          printf 'CRON_SECRET is too short.\n' >&2; exit 1
        fi
        authorization_header="Authorization: Bearer $${CRON_SECRET}"
        unset CRON_SECRET
        consecutive_failures=0
        success_marker=/tmp/media-maintenance.last-success
        while true; do
          response_file=/tmp/media-maintenance.json
          rm -f "$${response_file}"
          if status="$$(
            printf '%s\n' "$${authorization_header}" |
              node /opt/q-academy/dispatcher-http-post.mjs \
                --url 'http://media-runner:3000/api/internal/jobs/media/maintenance?limit=5' \
                --timeout-seconds 550 \
                --output "$${response_file}"
          )"; then :; else status=000; fi
          body=""
          if [ -f "$${response_file}" ]; then body="$$(cat "$${response_file}")"; fi
          rm -f "$${response_file}"
          case "$${status}" in
            2??)
              consecutive_failures=0
              now="$$(date +%s)"
              printf '%s\n' "$${now}" > "$${success_marker}.tmp"
              mv "$${success_marker}.tmp" "$${success_marker}"
              case "$${body}" in
                *'"processed":0'*) ;;
                *) printf '%s media maintenance completed\n' "$$(date -u +%FT%TZ)" ;;
              esac
              ;;
            *)
              consecutive_failures="$$((consecutive_failures + 1))"
              printf '%s media maintenance failure %s/%s, HTTP %s\n' "$$(date -u +%FT%TZ)" "$${consecutive_failures}" "$${WORKER_MAX_CONSECUTIVE_FAILURES}" "$${status:-000}" >&2
              if [ "$${consecutive_failures}" -ge "$${WORKER_MAX_CONSECUTIVE_FAILURES}" ]; then exit 1; fi
              ;;
          esac
          sleep "$${MEDIA_MAINTENANCE_INTERVAL_SECONDS}"
        done
    depends_on:
      media-runner:
        condition: service_healthy
    networks:
      - jobs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/media-maintenance.last-success && last_success=$$(cat /tmp/media-maintenance.last-success) && now=$$(date +%s) && test \"$${last_success}\" -le \"$${now}\" && test \"$$((now - last_success))\" -le \"$${WORKER_HEARTBEAT_STALE_SECONDS}\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 12m
    logging: *default-logging

  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE to a digest-pinned reference}
    restart: "on-failure:5"
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${PROMETHEUS_APP_BEARER_TOKEN_FILE:-/etc/q-academy/prometheus-app-token}:/run/secrets/app_metrics_token:ro
      - ${PROMETHEUS_MEDIA_BEARER_TOKEN_FILE:-/etc/q-academy/prometheus-media-token}:/run/secrets/media_metrics_token:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      media-runner:
        condition: service_healthy
      node-exporter:
        condition: service_started
    networks:
      - proxy
      - jobs
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  node-exporter:
    profiles: ["monitoring"]
    image: ${NODE_EXPORTER_IMAGE:?Set NODE_EXPORTER_IMAGE to a digest-pinned reference}
    restart: "on-failure:5"
    init: true
    command:
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host/root:ro,rslave
      - ${BACKUP_METRICS_DIR:-/var/lib/q-academy-observability}:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy-volume-init:
    image: q-academy-caddy:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
    restart: "no"
    user: "0:0"
    command: ["initialize-volumes"]
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    pids_limit: 32
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: q-academy-caddy:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
    restart: "on-failure:5"
    user: "10001:10001"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the production env file}
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES:?Set CADDY_SITE_ADDRESSES in the production env file}
      CADDY_TLS_ASK_SECRET: ${CADDY_TLS_ASK_SECRET:?Set CADDY_TLS_ASK_SECRET in the production env file}
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_SITES_DIRECTORY:-./deploy/caddy-sites}:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      caddy-volume-init:
        condition: service_completed_successfully
    networks:
      proxy:
        aliases:
          - ${APP_DOMAIN:?Set APP_DOMAIN in the production env file}
      tls-ask:
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=10001,gid=10001
    pids_limit: 256
    cap_drop:
      - ALL
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

configs:
  clamav-daemon-entrypoint:
    file: ./scripts/ops/clamav-daemon-entrypoint.sh
  clamav-render-config:
    file: ./scripts/ops/clamav-render-config.sh
  clamav-signature-health:
    file: ./scripts/ops/clamav-signature-health.sh
  database-config-preflight:
    file: ./scripts/ops/database-config-preflight.sh
  database-role-entrypoint:
    file: ./scripts/ops/database-role-entrypoint.sh
  database-permissions-entrypoint:
    file: ./scripts/ops/database-permissions-entrypoint.sh

networks:
  proxy:
    driver: bridge
  tls-ask:
    driver: bridge
    internal: true
  database:
    driver: bridge
    internal: true
  media-database:
    driver: bridge
    internal: true
  media:
    driver: bridge
    internal: true
  jobs:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  observability:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  next_cache:
  media_next_cache:
  caddy_data:
  caddy_config:
  clamav_signatures:
  prometheus_data:
  strato_sweeper_state:
