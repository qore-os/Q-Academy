name: ${COMPOSE_PROJECT_NAME:-q-academy}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-tenant-ops-runtime: &tenant-ops-runtime
  profiles: ["operations"]
  image: q-academy-tenant-ops:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
  build:
    context: .
    dockerfile: Dockerfile
    target: tenant-ops
    args:
      NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
  restart: "no"
  init: true
  user: "1001:1001"
  working_dir: /app
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 128
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: none

services:
  release-verifier:
    profiles: ["operations"]
    image: q-academy-release-verifier:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: release-verifier
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  database-config-preflight:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a digest-pinned reference}
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-q_academy}
      POSTGRES_BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-q_academy_bootstrap}
      POSTGRES_BOOTSTRAP_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in the production env file}
      OWNER_POSTGRES_USER: ${OWNER_POSTGRES_USER:-q_academy_owner}
      OWNER_POSTGRES_PASSWORD: ${OWNER_POSTGRES_PASSWORD:?Set OWNER_POSTGRES_PASSWORD in the production env file}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-q_academy_app}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}
      MEDIA_POSTGRES_USER: ${MEDIA_POSTGRES_USER:-q_academy_media}
      MEDIA_POSTGRES_PASSWORD: ${MEDIA_POSTGRES_PASSWORD:?Set MEDIA_POSTGRES_PASSWORD in the production env file}
    command: ["/bin/sh", "/opt/q-academy/database-config-preflight.sh"]
    configs:
      - source: database-config-preflight
        target: /opt/q-academy/database-config-preflight.sh
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a digest-pinned reference}
    restart: "on-failure:5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-q_academy}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-q_academy_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in the production env file}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    depends_on:
      database-config-preflight:
        condition: service_completed_successfully
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
      - media-database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  database-role:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a digest-pinned reference}
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-q_academy}
      POSTGRES_BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-q_academy_bootstrap}
      POSTGRES_BOOTSTRAP_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in the production env file}
      OWNER_POSTGRES_USER: ${OWNER_POSTGRES_USER:-q_academy_owner}
      OWNER_POSTGRES_PASSWORD: ${OWNER_POSTGRES_PASSWORD:?Set OWNER_POSTGRES_PASSWORD in the production env file}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-q_academy_app}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}
      MEDIA_POSTGRES_USER: ${MEDIA_POSTGRES_USER:-q_academy_media}
      MEDIA_POSTGRES_PASSWORD: ${MEDIA_POSTGRES_PASSWORD:?Set MEDIA_POSTGRES_PASSWORD in the production env file}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-q_academy}
      PGUSER: ${POSTGRES_BOOTSTRAP_USER:-q_academy_bootstrap}
      PGPASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in the production env file}
      OWNER_DATABASE_USER: ${OWNER_POSTGRES_USER:-q_academy_owner}
      OWNER_DATABASE_PASSWORD: ${OWNER_POSTGRES_PASSWORD:?Set OWNER_POSTGRES_PASSWORD in the production env file}
      APP_DATABASE_USER: ${APP_POSTGRES_USER:-q_academy_app}
      APP_DATABASE_PASSWORD: ${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}
      MEDIA_DATABASE_USER: ${MEDIA_POSTGRES_USER:-q_academy_media}
      MEDIA_DATABASE_PASSWORD: ${MEDIA_POSTGRES_PASSWORD:?Set MEDIA_POSTGRES_PASSWORD in the production env file}
    command: ["/bin/sh", "/opt/q-academy/database-role-entrypoint.sh"]
    configs:
      - source: database-config-preflight
        target: /opt/q-academy/database-config-preflight.sh
      - source: database-role-entrypoint
        target: /opt/q-academy/database-role-entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    image: q-academy-migrator:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${OWNER_POSTGRES_USER:-q_academy_owner}:${OWNER_POSTGRES_PASSWORD:?Set OWNER_POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-q_academy}
    depends_on:
      database-role:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  database-permissions:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a digest-pinned reference}
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-q_academy}
      PGUSER: ${OWNER_POSTGRES_USER:-q_academy_owner}
      PGPASSWORD: ${OWNER_POSTGRES_PASSWORD:?Set OWNER_POSTGRES_PASSWORD in the production env file}
      OWNER_DATABASE_USER: ${OWNER_POSTGRES_USER:-q_academy_owner}
      APP_DATABASE_USER: ${APP_POSTGRES_USER:-q_academy_app}
      MEDIA_DATABASE_USER: ${MEDIA_POSTGRES_USER:-q_academy_media}
    command: ["/bin/sh", "/opt/q-academy/database-permissions-entrypoint.sh"]
    configs:
      - source: database-permissions-entrypoint
        target: /opt/q-academy/database-permissions-entrypoint.sh
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  key-rotation:
    profiles: ["operations"]
    image: q-academy-key-rotation:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: key-rotation
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-q_academy_app}:${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-q_academy}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in the production env file}
      WEBHOOK_ENCRYPTION_KEY_ID: ${WEBHOOK_ENCRYPTION_KEY_ID:?Set WEBHOOK_ENCRYPTION_KEY_ID in the production env file}
      WEBHOOK_ENCRYPTION_PREVIOUS_KEYS: ${WEBHOOK_ENCRYPTION_PREVIOUS_KEYS:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in the production env file}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?Set DATA_ENCRYPTION_KEY_ID in the production env file}
      DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  tenant-admin-ops:
    <<: *tenant-ops-runtime
    environment:
      NODE_ENV: production
      Q_ACADEMY_OPS_SCOPE: admin
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-q_academy_app}:${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-q_academy}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in the production env file}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-q-academy}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON: ${MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON:?Set MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON in the production env file}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in the production env file}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?Set DATA_ENCRYPTION_KEY_ID in the production env file}
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    networks:
      - database
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  tenant-export-ops:
    <<: *tenant-ops-runtime
    environment:
      NODE_ENV: production
      Q_ACADEMY_OPS_SCOPE: export
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-q_academy_app}:${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-q_academy}
      AUDIT_EXPORT_HMAC_KEY: ${AUDIT_EXPORT_HMAC_KEY:-}
      AUDIT_EXPORT_HMAC_KEY_ID: ${AUDIT_EXPORT_HMAC_KEY_ID:-}
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    networks:
      - database
    volumes:
      - type: bind
        source: ${OPERATIONS_EXPORT_DIR:-/var/lib/q-academy/operations-exports}
        target: /operations/output
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  tenant-erasure-ops:
    <<: *tenant-ops-runtime
    environment:
      NODE_ENV: production
      Q_ACADEMY_OPS_SCOPE: erasure
      DATABASE_URL: postgresql://${OWNER_POSTGRES_USER:-q_academy_owner}:${OWNER_POSTGRES_PASSWORD:?Set OWNER_POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-q_academy}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in the production env file}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?Set DATA_ENCRYPTION_KEY_ID in the production env file}
      DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
      AUDIT_EXPORT_HMAC_KEY: ${AUDIT_EXPORT_HMAC_KEY:-}
      AUDIT_EXPORT_HMAC_KEY_ID: ${AUDIT_EXPORT_HMAC_KEY_ID:-}
      TENANT_ERASURE_MIN_WAIT_DAYS: ${TENANT_ERASURE_MIN_WAIT_DAYS:-30}
      MEDIA_STORAGE_DRIVER: "s3"
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?Set MEDIA_S3_ENDPOINT in the production env file}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:?Set MEDIA_S3_REGION in the production env file}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?Set MEDIA_S3_BUCKET in the production env file}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:?Set MEDIA_S3_ACCESS_KEY_ID in the production env file}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:?Set MEDIA_S3_SECRET_ACCESS_KEY in the production env file}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}
      MEDIA_S3_COMPATIBILITY_MODE: ${MEDIA_S3_COMPATIBILITY_MODE:-versioned}
      MEDIA_S3_STRATO_LIMITATIONS_ACCEPTED: ${MEDIA_S3_STRATO_LIMITATIONS_ACCEPTED:-false}
      MEDIA_CLAMAV_HOST: clamav
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    networks:
      - database
      - egress
    volumes:
      - type: bind
        source: ${OPERATIONS_INPUT_DIR:-/var/lib/q-academy/operations-input}
        target: /operations/input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPERATIONS_EXPORT_DIR:-/var/lib/q-academy/operations-exports}
        target: /operations/output
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  artifact-verify-ops:
    <<: *tenant-ops-runtime
    environment:
      NODE_ENV: production
      Q_ACADEMY_OPS_SCOPE: verify
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in the production env file}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?Set DATA_ENCRYPTION_KEY_ID in the production env file}
      DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
      AUDIT_EXPORT_HMAC_KEY: ${AUDIT_EXPORT_HMAC_KEY:-}
      AUDIT_EXPORT_HMAC_KEY_ID: ${AUDIT_EXPORT_HMAC_KEY_ID:-}
    network_mode: none
    volumes:
      - type: bind
        source: ${OPERATIONS_EXPORT_DIR:-/var/lib/q-academy/operations-exports}
        target: /operations/input
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  http-slo-ops:
    <<: *tenant-ops-runtime
    environment:
      NODE_ENV: production
      Q_ACADEMY_OPS_SCOPE: http-slo
      HTTP_SLO_API_KEY_FILE: /run/secrets/http_slo_api_key
    depends_on:
      app:
        condition: service_healthy
    networks:
      - proxy
    volumes:
      - type: bind
        source: ${HTTP_SLO_API_KEY_SOURCE_FILE:-/etc/q-academy/http-slo-api-key}
        target: /run/secrets/http_slo_api_key
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  app: &app-runtime
    image: q-academy-app:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a digest-pinned reference}
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in the production env file}
        NEXT_PUBLIC_ENABLE_PWA: "true"
    restart: "on-failure:5"
    init: true
    environment:
      NODE_ENV: production
      Q_ACADEMY_RUNTIME_ROLE: app
      Q_ACADEMY_APP_VERSION: ${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to the release commit}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-q_academy_app}:${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-q_academy}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the production env file}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:?Set AUTH_RATE_LIMIT_SECRET in the production env file}
      CADDY_TLS_ASK_SECRET: ${CADDY_TLS_ASK_SECRET:?Set CADDY_TLS_ASK_SECRET in the production env file}
      TRUST_PROXY_HEADERS: "true"
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the production env file}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in the production env file}
      NEXT_PUBLIC_ENABLE_PWA: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?Set WEB_PUSH_VAPID_PUBLIC_KEY in the production env file}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:?Set WEB_PUSH_VAPID_PRIVATE_KEY in the production env file}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?Set WEB_PUSH_VAPID_SUBJECT in the production env file}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-q-academy}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON: ${MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON:?Set MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON in the production env file}
      API_ALLOWED_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in the production env file}
      ENABLE_DEMO_LOGIN: "false"
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in the production env file}
      WEBHOOK_ENCRYPTION_KEY_ID: ${WEBHOOK_ENCRYPTION_KEY_ID:?Set WEBHOOK_ENCRYPTION_KEY_ID in the production env file}
      WEBHOOK_ENCRYPTION_PREVIOUS_KEYS: ${WEBHOOK_ENCRYPTION_PREVIOUS_KEYS:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in the production env file}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?Set DATA_ENCRYPTION_KEY_ID in the production env file}
      DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
      MFA_RECOVERY_PEPPER: ${MFA_RECOVERY_PEPPER:?Set MFA_RECOVERY_PEPPER in the production env file}
      MFA_RECOVERY_PEPPER_ID: ${MFA_RECOVERY_PEPPER_ID:?Set MFA_RECOVERY_PEPPER_ID in the production env file}
      MFA_RECOVERY_PREVIOUS_PEPPERS: ${MFA_RECOVERY_PREVIOUS_PEPPERS:-}
      PRIVACY_SUBJECT_HMAC_SECRET: ${PRIVACY_SUBJECT_HMAC_SECRET:?Set PRIVACY_SUBJECT_HMAC_SECRET in the production env file}
      EXAM_SELECTION_SECRET: ${EXAM_SELECTION_SECRET:?Set EXAM_SELECTION_SECRET in the production env file}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in the production env file}
      METRICS_SECRET: ${METRICS_SECRET:?Set METRICS_SECRET in the production env file}
      EMAIL_DELIVERY_REQUIRED: ${EMAIL_DELIVERY_REQUIRED:-true}
      EMAIL_DELIVERY_WEBHOOK_URL: ${EMAIL_DELIVERY_WEBHOOK_URL:-}
      EMAIL_DELIVERY_WEBHOOK_SECRET: ${EMAIL_DELIVERY_WEBHOOK_SECRET:-}
      EMAIL_DELIVERY_INBOUND_SECRET: ${EMAIL_DELIVERY_INBOUND_SECRET:?Set EMAIL_DELIVERY_INBOUND_SECRET in the production env file}
      EMAIL_DELIVERY_RETENTION_DAYS: ${EMAIL_DELIVERY_RETENTION_DAYS:-90}
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-90}
      PUSH_DELIVERY_RETENTION_DAYS: ${PUSH_DELIVERY_RETENTION_DAYS:-90}
      COMMUNITY_AUTHOR_BOOST_RETENTION_DAYS: ${COMMUNITY_AUTHOR_BOOST_RETENTION_DAYS:-90}
      LEGAL_IMPRINT_URL: ${LEGAL_IMPRINT_URL:?Set LEGAL_IMPRINT_URL in the production env file}
      LEGAL_PRIVACY_URL: ${LEGAL_PRIVACY_URL:?Set LEGAL_PRIVACY_URL in the production env file}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL in the production env file}
      MEDIA_STORAGE_DRIVER: "s3"
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?Set MEDIA_S3_ENDPOINT in the production env file}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:?Set MEDIA_S3_REGION in the production env file}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?Set MEDIA_S3_BUCKET in the production env file}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_APP_ACCESS_KEY_ID:?Set MEDIA_S3_APP_ACCESS_KEY_ID in the production env file}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_APP_SECRET_ACCESS_KEY:?Set MEDIA_S3_APP_SECRET_ACCESS_KEY in the production env file}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}
      MEDIA_S3_COMPATIBILITY_MODE: ${MEDIA_S3_COMPATIBILITY_MODE:-versioned}
      MEDIA_S3_STRATO_LIMITATIONS_ACCEPTED: ${MEDIA_S3_STRATO_LIMITATIONS_ACCEPTED:-false}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-2000000000}
      MEDIA_TENANT_QUOTA_BYTES: ${MEDIA_TENANT_QUOTA_BYTES:-536870912000}
      MEDIA_SIGNED_UPLOAD_TTL_SECONDS: ${MEDIA_SIGNED_UPLOAD_TTL_SECONDS:-900}
      MEDIA_MULTIPART_UPLOAD_TTL_SECONDS: ${MEDIA_MULTIPART_UPLOAD_TTL_SECONDS:-86400}
      MEDIA_SIGNED_DOWNLOAD_TTL_SECONDS: ${MEDIA_SIGNED_DOWNLOAD_TTL_SECONDS:-900}
      MEDIA_CLAMAV_HOST: clamav
      MEDIA_CLAMAV_PORT: "3310"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      STOCK_IMAGE_PROVIDER_NAME: ${STOCK_IMAGE_PROVIDER_NAME:-}
      STOCK_IMAGE_PROVIDER_BASE_URL: ${STOCK_IMAGE_PROVIDER_BASE_URL:-}
      STOCK_IMAGE_PROVIDER_API_KEY: ${STOCK_IMAGE_PROVIDER_API_KEY:-}
      STOCK_IMAGE_ALLOWED_HOSTS: ${STOCK_IMAGE_ALLOWED_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      database-permissions:
        condition: service_completed_successfully
    networks:
      proxy:
      database:
      tls-ask:
        aliases:
          - tls-ask-app
    volumes:
      - next_cache:/app/.next/cache
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    # The app admits one in-memory DSAR operation at a time (32 MiB plaintext,
    # 64 MiB envelope); 2 GiB leaves headroom for AES/base64 and normal traffic.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging

