# OWASP ZAP baseline rule policy for the unauthenticated Q-Academy CI surface.
# Rules not listed here retain ZAP's WARN default and therefore fail CI because
# the runner deliberately does not pass -I. Rule families 10055 and 10202 are
# demoted only because scripts/ci/validate-zap-baseline.ts performs a
# fail-closed, instance-level review of their JSON report entries.

