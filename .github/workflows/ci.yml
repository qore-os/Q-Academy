            -e EMAIL_DELIVERY_REQUIRED=true \
            -e EMAIL_DELIVERY_WEBHOOK_URL=https://mailer.ci.q-academy.de/q-academy \
            -e EMAIL_DELIVERY_WEBHOOK_SECRET="$RUNTIME_MAIL_SECRET" \
            -e EMAIL_DELIVERY_INBOUND_SECRET="$RUNTIME_MAIL_INBOUND_SECRET" \
            -e WEB_PUSH_VAPID_PUBLIC_KEY="$WEB_PUSH_VAPID_PUBLIC_KEY" \
            -e WEB_PUSH_VAPID_PRIVATE_KEY="$WEB_PUSH_VAPID_PRIVATE_KEY" \
            -e WEB_PUSH_VAPID_SUBJECT="$WEB_PUSH_VAPID_SUBJECT" \
            -e LEGAL_IMPRINT_URL=https://legal.ci.q-academy.de/impressum \
            -e LEGAL_PRIVACY_URL=https://legal.ci.q-academy.de/datenschutz \
            -e SUPPORT_EMAIL=support@ci.q-academy.de \
            -e MEDIA_STORAGE_DRIVER=s3 \
            -e MEDIA_S3_ENDPOINT=https://objects.ci.q-academy.de \
            -e MEDIA_S3_REGION=eu-central-1 \
            -e MEDIA_S3_BUCKET=q-academy-ci-media \
            -e MEDIA_S3_BROWSER_ALLOWED_ORIGINS_JSON="[\"$RUNTIME_APP_URL\"]" \
            -e MEDIA_S3_ACCESS_KEY_ID=QACADEMYCIMEDIA \
            -e MEDIA_S3_SECRET_ACCESS_KEY=CiMedia-5RtY1uI7oP3aS9dF4gH6jK0lZ2xCvBnM \
            -e MEDIA_S3_FORCE_PATH_STYLE=false \
            -e MEDIA_CLAMAV_HOST=127.0.0.1 \
            -e MEDIA_CLAMAV_PORT=3310 \
            "q-academy-app:$Q_ACADEMY_CI_RELEASE_TAG"

          app_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/v1/health/ready \
              | node -e "let input='';process.stdin.setEncoding('utf8');process.stdin.on('data',(chunk)=>input+=chunk);process.stdin.on('end',()=>{try{const body=JSON.parse(input);if(body?.data?.schema!=='current'||body?.data?.version!==process.env.Q_ACADEMY_CI_RELEASE_TAG)process.exitCode=1}catch{process.exitCode=1}})"; then
              app_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$app_ready" != true ]]; then
            docker logs q-academy-ci-runtime
            exit 1
          fi

          trap - EXIT

      - name: Run passive OWASP ZAP baseline
        id: zap_baseline
        shell: bash
        run: bash scripts/ops/run-zap-baseline.sh

      - name: Upload OWASP ZAP baseline evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: q-academy-zap-baseline-${{ github.sha }}
          path: .artifacts/zap-baseline
          if-no-files-found: warn
          retention-days: 14

      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium

      - name: Prepare ephemeral production-smoke credentials
        id: prepare_production_smoke_credentials
        shell: bash
        env:
          NODE_ENV: test
          ALLOW_DESTRUCTIVE_SEED: "true"
          SEED_EXPECTED_DATABASE: q_academy
        run: ./node_modules/.bin/tsx scripts/ci/production-smoke-credentials.ts prepare

      - name: Smoke-test exact production app image
        shell: bash
        env:
          PLAYWRIGHT_PRODUCTION_BASE_URL: ${{ env.RUNTIME_SMOKE_ORIGIN }}
          PLAYWRIGHT_EXPECTED_RELEASE: ${{ env.Q_ACADEMY_CI_RELEASE_TAG }}
          PLAYWRIGHT_ADMIN_EMAIL: admin@q-academy.de
          PLAYWRIGHT_MEMBER_EMAIL: lea@q-academy.de
          PLAYWRIGHT_API_KEY: ${{ env.DEMO_API_KEY }}
        run: |
          image_reference="q-academy-app:$Q_ACADEMY_CI_RELEASE_TAG"
          expected_image_id="$(docker image inspect --format '{{.Id}}' "$image_reference")"
          running_image_id="$(docker inspect --format '{{.Image}}' q-academy-ci-runtime)"
          if [[ "$running_image_id" != "$expected_image_id" ]]; then
            echo "Running app container does not use the exact tested image ID." >&2
            exit 1
          fi
          printf 'Production app image ID: %s\n' "$expected_image_id"

          certificate_file="$RUNNER_TEMP/q-academy-production-smoke.crt"
          private_key_file="$RUNNER_TEMP/q-academy-production-smoke.key"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$private_key_file" \
            -out "$certificate_file" \
            -days 1 \
            -subj '/CN=academy.ci.q-academy.de' \
            -addext 'subjectAltName=DNS:academy.ci.q-academy.de'
          printf '127.0.0.1 academy.ci.q-academy.de\n' \
            | sudo tee -a /etc/hosts >/dev/null

          cleanup_proxy() {
            if [[ -n "${proxy_pid:-}" ]]; then
              kill "$proxy_pid" >/dev/null 2>&1 || true
              wait "$proxy_pid" >/dev/null 2>&1 || true
            fi
            rm -f "$certificate_file" "$private_key_file"
          }
          trap cleanup_proxy EXIT

          PRODUCTION_SMOKE_PUBLIC_ORIGIN="$PLAYWRIGHT_PRODUCTION_BASE_URL" \
          PRODUCTION_SMOKE_UPSTREAM_ORIGIN=http://127.0.0.1:3000 \
          PRODUCTION_SMOKE_LISTEN_HOST=127.0.0.1 \
          PRODUCTION_SMOKE_LISTEN_PORT=3443 \
          PRODUCTION_SMOKE_CERT_FILE="$certificate_file" \
          PRODUCTION_SMOKE_KEY_FILE="$private_key_file" \
            node scripts/ci/production-smoke-tls-proxy.mjs \
              >.data/production-smoke-tls-proxy.log 2>&1 &
          proxy_pid=$!

          proxy_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure --noproxy '*' \
              --resolve academy.ci.q-academy.de:3443:127.0.0.1 \
              "$PLAYWRIGHT_PRODUCTION_BASE_URL/api/v1/health/ready" \
              >/dev/null; then
              proxy_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$proxy_ready" != true ]]; then
            cat .data/production-smoke-tls-proxy.log
            exit 1
          fi

          smoke_status=0
          npx playwright test \
            --config=playwright.production-smoke.config.ts || smoke_status=$?

          tagged_image_id="$(docker image inspect --format '{{.Id}}' "$image_reference")"
          running_image_id="$(docker inspect --format '{{.Image}}' q-academy-ci-runtime)"
          if [[ "$tagged_image_id" != "$expected_image_id" || "$running_image_id" != "$expected_image_id" ]]; then
            echo "Production app image identity changed during the browser smoke." >&2
            exit 1
          fi
          exit "$smoke_status"

      - name: Restore disposable demo credentials
        if: always() && steps.prepare_production_smoke_credentials.outcome != 'skipped'
        shell: bash
        env:
          NODE_ENV: test
          ALLOW_DESTRUCTIVE_SEED: "true"
          SEED_EXPECTED_DATABASE: q_academy
        run: ./node_modules/.bin/tsx scripts/ci/production-smoke-credentials.ts restore

      - name: Smoke-test production media worker
        shell: bash
        env:
          RUNTIME_MEDIA_DATABASE_URL: postgresql://q_academy_ci_media:8e7f6a5b4c3d22110099887766554433ccddeeff00112233445566778899aabb@ci-postgres.internal:54329/q_academy
          RUNTIME_MEDIA_CRON_SECRET: 7d6e5f4a3b2c11009988776655443322bbccddeeff00112233445566778899aa
          RUNTIME_MEDIA_METRICS_SECRET: 9f8e7d6c5b4a33221100998877665544ddeeff00112233445566778899aabbdd
        run: |
          cleanup() {
            docker rm --force q-academy-ci-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          media_work_root="$RUNNER_TEMP/q-academy-media-processing"
          sudo install -d -o root -g root -m 0755 "$media_work_root"
          sudo install -d -o 1001 -g 1001 -m 0700 "$media_work_root/work"
          printf '%s\n' q-academy-media-processing-v1 \
            | sudo tee "$media_work_root/.q-academy-media-work-root" >/dev/null
          sudo chown root:root "$media_work_root/.q-academy-media-work-root"
          sudo chmod 0444 "$media_work_root/.q-academy-media-work-root"

          media_image="q-academy-media-runner:$Q_ACADEMY_CI_RELEASE_TAG"
          expected_media_command='["./node_modules/.bin/next","start","-H","0.0.0.0","-p","3000"]'
          configured_media_command="$(docker image inspect --format '{{json .Config.Cmd}}' "$media_image")"
          if [[ "$configured_media_command" != "$expected_media_command" ]]; then
            echo "Production media image has no exact startup command." >&2
            exit 1
          fi

          docker rm --force q-academy-ci-runtime >/dev/null
          docker run --detach --name q-academy-ci-runtime --network host \
            --add-host ci-postgres.internal:127.0.0.1 \
            -e Q_ACADEMY_RUNTIME_ROLE=media-worker \
            -e Q_ACADEMY_APP_VERSION="$Q_ACADEMY_CI_RELEASE_TAG" \
            -e DATABASE_URL="$RUNTIME_MEDIA_DATABASE_URL" \
            -e CRON_SECRET="$RUNTIME_MEDIA_CRON_SECRET" \
            -e METRICS_SECRET="$RUNTIME_MEDIA_METRICS_SECRET" \
            -e MEDIA_STORAGE_DRIVER=s3 \
            -e MEDIA_S3_ENDPOINT=https://objects.ci.q-academy.de \
            -e MEDIA_S3_REGION=eu-central-1 \
            -e MEDIA_S3_BUCKET=q-academy-ci-media \
            -e MEDIA_S3_ACCESS_KEY_ID=QACADEMYCIMEDIAWORKER \
            -e MEDIA_S3_SECRET_ACCESS_KEY=CiMediaWorker-7YuI3oP9aS5dF1gH6jK8lZ2xC4vBnMqW \
            -e MEDIA_S3_FORCE_PATH_STYLE=false \
            -e MEDIA_CLAMAV_HOST=127.0.0.1 \
            -e MEDIA_CLAMAV_PORT=3310 \
            -e MEDIA_PROCESSING_WORK_ROOT=/var/lib/q-academy-media-processing/work \
            --volume "$media_work_root:/var/lib/q-academy-media-processing" \
            "$media_image"

          media_ready=false
          for attempt in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' q-academy-ci-runtime)" != true ]]; then
              docker inspect --format 'Media container state: status={{.State.Status}} exitCode={{.State.ExitCode}} error={{json .State.Error}}' q-academy-ci-runtime
              docker logs q-academy-ci-runtime
              exit 1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/v1/health/ready \
              | node -e "let input='';process.stdin.setEncoding('utf8');process.stdin.on('data',(chunk)=>input+=chunk);process.stdin.on('end',()=>{try{const body=JSON.parse(input);if(body?.data?.schema!=='current'||body?.data?.version!==process.env.Q_ACADEMY_CI_RELEASE_TAG)process.exitCode=1}catch{process.exitCode=1}})"; then
              media_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$media_ready" != true ]]; then
            docker logs q-academy-ci-runtime
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $RUNTIME_MEDIA_CRON_SECRET" \
            --request POST \
            'http://127.0.0.1:3000/api/internal/jobs/media/dispatch?limit=1' \
            | grep --quiet '"processed"'

      - name: Stop disposable CI runtime
        if: always()
        shell: bash
        run: docker rm --force q-academy-ci-runtime >/dev/null 2>&1 || true

      - name: Install pinned Trivy scanner
        shell: bash
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_LINUX_AMD64_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          printf '%s  %s\n' "$TRIVY_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          sudo tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory /usr/local/bin trivy
          rm -f -- "$RUNNER_TEMP/$archive"
          trivy --version

      - name: Reclaim runner space without deleting tested release images
        shell: bash
        run: |
          set -euo pipefail

          image_components=(postgres app migrator key-rotation tenant-ops media-runner media-preflight s3-app-principal-preflight dispatcher caddy)
          before_manifest="$RUNNER_TEMP/q-academy-release-image-ids.before"
          after_manifest="$RUNNER_TEMP/q-academy-release-image-ids.after"

          record_release_image_ids() {
            local output_file="$1"
            : >"$output_file"
            for component in "${image_components[@]}"; do
              image="q-academy-$component:$Q_ACADEMY_CI_RELEASE_TAG"
              image_id="$(docker image inspect --format '{{.Id}}' "$image")"
              if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "Release image has an invalid content ID: $image" >&2
                exit 1
              fi
              printf '%s=%s\n' "$image" "$image_id" >>"$output_file"
            done
          }

          echo "Disk usage before targeted cleanup:"
          df -h -- / "$RUNNER_TEMP" /tmp
          docker system df
          du -sh -- .next node_modules "$NPM_CONFIG_CACHE" "$HOME/.cache/ms-playwright" .data 2>/dev/null || true
          record_release_image_ids "$before_manifest"

          docker container prune --force
          docker image rm "$CI_ZAP_IMAGE" "$CI_PROMETHEUS_IMAGE"
          docker builder prune --all --force
          docker image prune --force
          rm -rf -- "$NPM_CONFIG_CACHE/_logs" "$NPM_CONFIG_CACHE/_npx"
          rm -rf -- .next

          record_release_image_ids "$after_manifest"
          cmp --silent "$before_manifest" "$after_manifest" || {
            echo "Targeted cleanup changed a smoke-tested release image ID." >&2
            diff -- "$before_manifest" "$after_manifest" || true
            exit 1
          }

          echo "Disk usage after targeted cleanup:"
          df -h -- / "$RUNNER_TEMP" /tmp
          docker system df
          for component in "${image_components[@]}"; do
            image="q-academy-$component:$Q_ACADEMY_CI_RELEASE_TAG"
            printf '%s ' "$image"
            docker image inspect --format 'id={{.Id}} size={{.Size}}' "$image"
          done
          du -sh -- node_modules "$HOME/.cache/ms-playwright" .data 2>/dev/null || true

          available_bytes="$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1 | tr -d '[:space:]')"
          required_bytes=$((6 * 1024 * 1024 * 1024))
          if [[ ! "$available_bytes" =~ ^[0-9]+$ ]] || (( available_bytes < required_bytes )); then
            echo "At least 6 GiB of free runner space is required before Trivy image export." >&2
            exit 1
          fi

      - name: Scan images, generate SBOMs, and package tested images
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          bash scripts/ops/create-release-artifact.sh \
            "$Q_ACADEMY_CI_RELEASE_TAG" .artifacts/release

      - name: Install browser engines
        run: npx playwright install --with-deps firefox webkit

      - name: Grant disposable CI cleanup parameter
        shell: bash
        run: |
          touch .data/session-replication-role-grant.active
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const databaseAdmin = postgres(process.env.POSTGRES_ADMIN_URL, { max: 1 });
          try {
            await databaseAdmin.unsafe(
              "revoke set on parameter session_replication_role from public, q_academy_ci, q_academy_ci_app, q_academy_ci_media",
            );
            const [baseline] = await databaseAdmin.unsafe(`
              select
                (select rolsuper from pg_roles where rolname = 'q_academy_ci') as ci_is_superuser,
                (select rolsuper from pg_roles where rolname = 'q_academy_ci_app') as app_is_superuser,
                (select rolsuper from pg_roles where rolname = 'q_academy_ci_media') as media_is_superuser,
                has_parameter_privilege('q_academy_ci_app', 'session_replication_role', 'SET') as app_can_set,
                has_parameter_privilege('q_academy_ci_media', 'session_replication_role', 'SET') as media_can_set
            `);
            if (
              baseline.ci_is_superuser !== false ||
              baseline.app_is_superuser !== false ||
              baseline.media_is_superuser !== false ||
              baseline.app_can_set !== false ||
              baseline.media_can_set !== false
            ) {
              throw new Error("Disposable CI database roles failed the pre-Playwright privilege baseline.");
            }

            await databaseAdmin.unsafe(
              "grant set on parameter session_replication_role to q_academy_ci",
            );
            const [granted] = await databaseAdmin.unsafe(`
              select
                (select rolsuper from pg_roles where rolname = 'q_academy_ci') as ci_is_superuser,
                has_parameter_privilege('q_academy_ci', 'session_replication_role', 'SET') as ci_can_set,
                has_parameter_privilege('q_academy_ci_app', 'session_replication_role', 'SET') as app_can_set,
                has_parameter_privilege('q_academy_ci_media', 'session_replication_role', 'SET') as media_can_set
            `);
            if (
              granted.ci_is_superuser !== false ||
              granted.ci_can_set !== true ||
              granted.app_can_set !== false ||
              granted.media_can_set !== false
            ) {
              throw new Error("Disposable CI cleanup parameter grant verification failed.");
            }
          } finally {
            await databaseAdmin.end();
          }
          NODE

      - name: Run Playwright suite
        shell: bash
        env:
          ENABLE_DEMO_LOGIN: "true"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          for project in chromium mobile; do
            for shard in 1 2 3 4 5 6; do
              echo "Running Playwright project $project shard $shard/6"
              PLAYWRIGHT_RESET_EXPECTED_DATABASE=q_academy \
              PLAYWRIGHT_RESET_EXPECTED_OWNER=q_academy_ci \
                npx tsx scripts/ci/reset-playwright-database.ts
              rm -rf -- .data/media
              npm run db:migrate
              NODE_ENV=test \
              ALLOW_DESTRUCTIVE_SEED=true \
              SEED_EXPECTED_DATABASE=q_academy \
                npm run db:seed
              npm run test:e2e -- --project="$project" --shard="$shard/6"
            done
          done

      - name: Run Firefox and WebKit core flows
        shell: bash
        env:
          ENABLE_DEMO_LOGIN: "true"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          PLAYWRIGHT_RESET_EXPECTED_DATABASE=q_academy \
          PLAYWRIGHT_RESET_EXPECTED_OWNER=q_academy_ci \
            npx tsx scripts/ci/reset-playwright-database.ts
          rm -rf -- .data/media
          npm run db:migrate
          NODE_ENV=test \
          ALLOW_DESTRUCTIVE_SEED=true \
          SEED_EXPECTED_DATABASE=q_academy \
            npm run db:seed
          npm run test:e2e:cross-browser

      - name: Revoke disposable CI cleanup parameter
        if: always()
        shell: bash
        run: |
          if [[ ! -f .data/session-replication-role-grant.active ]]; then
            echo "Disposable CI cleanup parameter was not granted."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const databaseAdmin = postgres(process.env.POSTGRES_ADMIN_URL, { max: 1 });
          try {
            await databaseAdmin.unsafe(
              "revoke set on parameter session_replication_role from public, q_academy_ci, q_academy_ci_app, q_academy_ci_media",
            );
            const [revoked] = await databaseAdmin.unsafe(`
              select
                (select rolsuper from pg_roles where rolname = 'q_academy_ci') as ci_is_superuser,
                (select rolsuper from pg_roles where rolname = 'q_academy_ci_app') as app_is_superuser,
                (select rolsuper from pg_roles where rolname = 'q_academy_ci_media') as media_is_superuser,
                has_parameter_privilege('q_academy_ci', 'session_replication_role', 'SET') as ci_can_set,
                has_parameter_privilege('q_academy_ci_app', 'session_replication_role', 'SET') as app_can_set,
                has_parameter_privilege('q_academy_ci_media', 'session_replication_role', 'SET') as media_can_set
            `);
            if (
              revoked.ci_is_superuser !== false ||
              revoked.app_is_superuser !== false ||
              revoked.media_is_superuser !== false ||
              revoked.ci_can_set !== false ||
              revoked.app_can_set !== false ||
              revoked.media_can_set !== false
            ) {
              throw new Error("Disposable CI cleanup parameter revoke verification failed.");
            }
          } finally {
            await databaseAdmin.end();
          }
          NODE
          rm -f .data/session-replication-role-grant.active

      - name: Upload tested release artifact and evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: q-academy-release-${{ github.sha }}
          path: .artifacts/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-failure-diagnostics
          path: |
            .data/postgres-ci.log
            .data/production-smoke-tls-proxy.log
            .artifacts/release/evidence
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -f .data/postgres-ci.pid ]]; then
            kill -TERM "$(cat .data/postgres-ci.pid)" || true
          fi

  backup-restore-drill:
    name: Disposable production backup/restore drill
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.Q_ACADEMY_CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: default
      Q_ACADEMY_DRILL_NODE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
      Q_ACADEMY_DRILL_POSTGRES_IMAGE: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify local system Docker target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOCKER_HOST" == "unix:///var/run/docker.sock" ]]
          [[ "$DOCKER_CONTEXT" == "default" ]]
          [[ -S /var/run/docker.sock ]]
          context_host="$(
            docker context inspect default --format '{{.Endpoints.docker.Host}}'
          )"
          [[ "$context_host" == "$DOCKER_HOST" ]]
          docker version --format '{{.Server.Version}}' >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required production backup/restore drill
        run: npm run test:backup-restore-drill:required

  sast:
    name: Required SAST release gate
    uses: ./.github/workflows/sast.yml

  publish-release:
    name: Publish immutable release images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [verify, backup-restore-drill, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      Q_ACADEMY_CI_RELEASE_TAG: git-${{ github.sha }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download tested release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: q-academy-release-${{ github.sha }}
          path: .artifacts/release

      - name: Set up publisher Docker image store
        uses: docker/setup-docker-action@6d7cfa65f60a9dda7b46e5513fa982536f3c9877 # v5.3.0
        with:
          version: v29.4.0
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Verify publisher Docker image store
        shell: bash
        run: |
          set -euo pipefail

          expected_version="29.4.0"
          actual_version="$(docker version --format '{{.Server.Version}}')"
          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Publisher Docker version mismatch: expected=%s actual=%s\n' \
              "$expected_version" "$actual_version" >&2
            exit 1
          fi

          driver_status="$(docker info --format '{{ .DriverStatus }}')"
          if ! grep -Fq 'io.containerd.snapshotter.v1' <<<"$driver_status"; then
            printf 'Publisher Docker is not using the containerd image store: %s\n' \
              "$driver_status" >&2
            exit 1
          fi

      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish the exact tested image IDs
        shell: bash
        run: |
          registry_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          bash scripts/ops/publish-release-images.sh \
            "$Q_ACADEMY_CI_RELEASE_TAG" \
            .artifacts/release \
            "$registry_root" \
            .artifacts/published/release-images.env

      - name: Attest the digest-pinned release manifest
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .artifacts/published/release-images.env

      - name: Collect provenance bundle
        shell: bash
        run: |
          cp -- "${{ steps.provenance.outputs.bundle-path }}" \
            .artifacts/published/release-images.intoto.jsonl

      - name: Upload published manifest and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: q-academy-published-release-${{ github.sha }}
          path: |
            .artifacts/published/release-images.env
            .artifacts/published/release-images.env.sha256
            .artifacts/published/release-images.intoto.jsonl
          if-no-files-found: error
          retention-days: 90
