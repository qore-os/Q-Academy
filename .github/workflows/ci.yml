        run: npx tsx scripts/ci/production-smoke-credentials.ts restore

      - name: Smoke-test production media worker
        shell: bash
        env:
          RUNTIME_MEDIA_DATABASE_URL: postgresql://q_academy_ci_media:8e7f6a5b4c3d22110099887766554433ccddeeff00112233445566778899aabb@ci-postgres.internal:54329/q_academy
          RUNTIME_MEDIA_CRON_SECRET: 7d6e5f4a3b2c11009988776655443322bbccddeeff00112233445566778899aa
          RUNTIME_MEDIA_METRICS_SECRET: 9f8e7d6c5b4a33221100998877665544ddeeff00112233445566778899aabbdd
        run: |
          cleanup() {
            docker rm --force q-academy-ci-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          media_work_root="$RUNNER_TEMP/q-academy-media-processing"
          sudo install -d -o root -g root -m 0755 "$media_work_root"
          sudo install -d -o 1001 -g 1001 -m 0700 "$media_work_root/work"
          printf '%s\n' q-academy-media-processing-v1 \
