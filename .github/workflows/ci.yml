            -e WEB_PUSH_VAPID_PRIVATE_KEY="$WEB_PUSH_VAPID_PRIVATE_KEY" \
            -e WEB_PUSH_VAPID_SUBJECT="$WEB_PUSH_VAPID_SUBJECT" \
            -e LEGAL_IMPRINT_URL=https://legal.ci.q-academy.de/impressum \
