      - name: Stop disposable CI runtime
        if: always()
        shell: bash
        run: docker rm --force q-academy-ci-runtime >/dev/null 2>&1 || true

      - name: Install pinned Trivy scanner
        shell: bash
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_LINUX_AMD64_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          printf '%s  %s\n' "$TRIVY_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          sudo tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory /usr/local/bin trivy
          rm -f -- "$RUNNER_TEMP/$archive"
          trivy --version

      - name: Reclaim runner space without deleting tested release images
        shell: bash
        run: |
          set -euo pipefail

          image_components=(app migrator key-rotation tenant-ops media-runner media-preflight s3-app-principal-preflight)
          before_manifest="$RUNNER_TEMP/q-academy-release-image-ids.before"
          after_manifest="$RUNNER_TEMP/q-academy-release-image-ids.after"

          record_release_image_ids() {
            local output_file="$1"
            : >"$output_file"
            for component in "${image_components[@]}"; do
              image="q-academy-$component:$Q_ACADEMY_CI_RELEASE_TAG"
              image_id="$(docker image inspect --format '{{.Id}}' "$image")"
              if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "Release image has an invalid content ID: $image" >&2
                exit 1
              fi
              printf '%s=%s\n' "$image" "$image_id" >>"$output_file"
            done
          }

          echo "Disk usage before targeted cleanup:"
          df -h -- / "$RUNNER_TEMP" /tmp
          docker system df
          du -sh -- .next node_modules "$HOME/.npm" "$HOME/.cache/ms-playwright" .data 2>/dev/null || true
          record_release_image_ids "$before_manifest"

          docker container prune --force
          docker image rm "$CI_ZAP_IMAGE" "$CI_PROMETHEUS_IMAGE"
          docker builder prune --all --force
          docker image prune --force
          npm cache clean --force
          rm -rf -- .next

          record_release_image_ids "$after_manifest"
          cmp --silent "$before_manifest" "$after_manifest" || {
            echo "Targeted cleanup changed a smoke-tested release image ID." >&2
            diff -- "$before_manifest" "$after_manifest" || true
            exit 1
          }

          echo "Disk usage after targeted cleanup:"
          df -h -- / "$RUNNER_TEMP" /tmp
          docker system df
          for component in "${image_components[@]}"; do
            image="q-academy-$component:$Q_ACADEMY_CI_RELEASE_TAG"
            printf '%s ' "$image"
            docker image inspect --format 'id={{.Id}} size={{.Size}}' "$image"
          done
          du -sh -- node_modules "$HOME/.cache/ms-playwright" .data 2>/dev/null || true

          available_bytes="$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1 | tr -d '[:space:]')"
          required_bytes=$((6 * 1024 * 1024 * 1024))
          if [[ ! "$available_bytes" =~ ^[0-9]+$ ]] || (( available_bytes < required_bytes )); then
            echo "At least 6 GiB of free runner space is required before Trivy image export." >&2
            exit 1
          fi

      - name: Scan images, generate SBOMs, and package tested images
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          bash scripts/ops/create-release-artifact.sh \
            "$Q_ACADEMY_CI_RELEASE_TAG" .artifacts/release

      - name: Install browser engines
        run: npx playwright install --with-deps firefox webkit

      - name: Run Playwright suite
        env:
          ENABLE_DEMO_LOGIN: "true"
        run: npm run test:e2e

      - name: Run Firefox and WebKit core flows
        env:
          ENABLE_DEMO_LOGIN: "true"
        run: npm run test:e2e:cross-browser

      - name: Upload tested release artifact and evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: q-academy-release-${{ github.sha }}
          path: .artifacts/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-failure-diagnostics
          path: |
            .data/postgres-ci.log
            .data/production-smoke-tls-proxy.log
            .artifacts/release/evidence
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -f .data/postgres-ci.pid ]]; then
            kill -TERM "$(cat .data/postgres-ci.pid)" || true
          fi

  backup-restore-drill:
    name: Disposable production backup/restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      Q_ACADEMY_DRILL_NODE_IMAGE: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
      Q_ACADEMY_DRILL_POSTGRES_IMAGE: postgres:16.14-alpine3.23@sha256:c95dee655b8a0743021bdbd2d21abb7ef2fd520c5df39bd328798769c049648f
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required production backup/restore drill
        run: npm run test:backup-restore-drill:required

  sast:
    name: Required SAST release gate
    uses: ./.github/workflows/sast.yml

  publish-release:
    name: Publish immutable release images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [verify, backup-restore-drill, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      Q_ACADEMY_CI_RELEASE_TAG: git-${{ github.sha }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download tested release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: q-academy-release-${{ github.sha }}
          path: .artifacts/release

      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish the exact tested image IDs
        shell: bash
        run: |
          registry_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          bash scripts/ops/publish-release-images.sh \
            "$Q_ACADEMY_CI_RELEASE_TAG" \
            .artifacts/release \
            "$registry_root" \
            .artifacts/published/release-images.env

      - name: Attest the digest-pinned release manifest
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .artifacts/published/release-images.env

      - name: Collect provenance bundle
        shell: bash
        run: |
          cp -- "${{ steps.provenance.outputs.bundle-path }}" \
            .artifacts/published/release-images.intoto.jsonl

      - name: Upload published manifest and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: q-academy-published-release-${{ github.sha }}
          path: |
            .artifacts/published/release-images.env
            .artifacts/published/release-images.env.sha256
            .artifacts/published/release-images.intoto.jsonl
          if-no-files-found: error
          retention-days: 90
