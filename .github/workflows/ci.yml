            -e MEDIA_CLAMAV_PORT=3310 \
            "q-academy-app:$Q_ACADEMY_CI_RELEASE_TAG"

          app_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/v1/health/ready \
              | node -e "let input='';process.stdin.setEncoding('utf8');process.stdin.on('data',(chunk)=>input+=chunk);process.stdin.on('end',()=>{try{const body=JSON.parse(input);if(body?.data?.schema!=='current'||body?.data?.version!==process.env.Q_ACADEMY_CI_RELEASE_TAG)process.exitCode=1}catch{process.exitCode=1}})"; then
              app_ready=true
              break
            fi
            sleep 1
          done
